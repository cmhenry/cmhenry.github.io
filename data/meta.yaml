short_about: |
  I study how the architecture of digital platforms shapes political behavior,
  with a focus on extremism, hate speech, and content moderation. Postdoc in the
  <a href="https://www.ipz.uzh.ch/en/research/professorships-and-research-areas/bdm.html">Political Behavior and Digital Media</a>
  group at the University of Z&uuml;rich; technical lead on the SNSF
  <a href="https://fabriziogilardi.org/projects/improving-online-discourse/">Improving Public Discourse</a> project.
