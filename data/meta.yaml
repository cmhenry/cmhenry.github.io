about: |
  I'm part of the
  <a href="https://www.ipz.uzh.ch/en/research/professorships-and-research-areas/bdm.html">Political Behavior and Digital Media research group</a>
  and lead on the
  <a href="https://fabriziogilardi.org/projects/improving-online-discourse/">SNSF Improving Public Discourse project</a>.
  I study how digital platform architecture influences political behavior and community dynamics —
  with a focus on extremism and hate speech.
  Previously a research fellow at George Washington University's Dynamic Online Networks Lab.
