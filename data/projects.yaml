- slug: snsf
  name: SNSF Improving Public Discourse
  status: active
  role: Technical lead
  summary: |
    <em>Improving Public Discourse</em> — Swiss National Science Foundation grant
    hosted at the University of Zürich Digital Democracy Lab (PI: Fabrizio Gilardi).
    I design and maintain the data collection and classification infrastructure
    across the program's studies.
  current: |
    Audit study of TikTok content moderation. Research assistants systematically
    review and flag content violating community guidelines; the platform's
    enforcement response is recorded and analyzed. Study launched March 2026
    and is actively running.
  methods: audit methodology, two-stage NLP classification (multilingual BERT + custom 9B-parameter LLM), Postgres + Redis, Ansible, Flask
  collaborators: Karsten Donnay (PI), Fabrizio Gilardi (PI), UZH DigDem Lab
  links:
    - label: project site
      url: https://fabriziogilardi.org/projects/improving-online-discourse/

- slug: virena
  name: VIRENA
  status: active
  summary: |
    <em>Indirect Effects of Content Moderation Errors: A Chatroom Experiment with AI Agents.</em>
    VIRENA is an experimental platform simulating WhatsApp-style social media chatrooms.
    Prolific participants interact in real-time with LLM-powered bot personas under
    randomized moderation conditions — over-moderation, under-moderation, and regular
    moderation. The experiment tests how moderation errors shape conversation dynamics
    and perceptions of online spaces.
  current: 800-participant study live. Platform rebuild (VIRENA) underway for future experiments.
  methods: Svelte.js (frontend), PocketBase + Go (backend), Ollama / OpenAI (bot personas), Prolific (participant recruitment)
  collaborators: Karsten Donnay, Giuliano Formisano, Emma Hoes, Jonathan Klues, Adiba Mahbub Proma, Fabrizio Gilardi (PI)

- slug: dissertation
  name: Dissertation
  status: wrapped
  summary: |
    "Governance, Competition, &amp; Extremism: How the Structure of Social Media Platforms
    Radicalizes Communities." Platform governance structures create competitive dynamics
    between communities that systematically drive radicalization. A comparative study of
    digital architectures and how they shape collective behavior.
  methods: multi-platform analysis (Reddit, Twitter, Telegram, TikTok, YouTube), transformer models, network analysis, digital ethnography
  collaborators: Jennifer Larson (co-chair), Cassy Dorff (co-chair), Emily Ritter, Anita Gohdes (Hertie School)
  links:
    - label: job-market paper
      url: https://github.com/cmhenry/cmhenry.github.io/raw/main/pdfs/Community_Competition.pdf

- slug: platform-abm
  name: Platform ABM
  status: active
  summary: |
    <em>Voting with Your Feeds: Platform Competition, Extremism, and the Limits of Tiebout Sorting.</em>
    Online platforms function as a system, not independent sites. Applying Tiebout's
    "voting with your feet" model to digital platforms, the paper shows that extremist
    communities act as utility vampires — degrading mainstream experiences and forcing
    displacement, raiding cycles, and ideological enclaves. The diversification premium
    grows with extremist threat intensity; governance type determines who benefits.
  methods: agent-based model, three-way ANOVA, bootstrap CIs, sensitivity analysis (OAT + Sobol indices). Python simulation; R/Python visualization
  current: Working paper — manuscript drafted, sensitivity analysis complete, figures integrated. Preparing for submission.
  links:
    - label: related — ideological fragmentation of the social media ecosystem (PNAS Nexus)
      url: https://academic.oup.com/pnasnexus/article/4/9/pgaf262/8232781
